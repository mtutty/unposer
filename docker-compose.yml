services:
  # Dev-mode edge proxy only — has no config of its own here because it's not meant to run
  # without docker-compose.override.yml, which is what supplies nginx/nginx.dev.conf (proxying
  # to the Angular dev server + api). Plain `docker-compose up` always auto-loads that override,
  # so this is the only way this service is actually started; production excludes it entirely by
  # name in favor of nginx-proxy (see docker-compose.production.yml) instead of overriding it in
  # place, for the same reason. `docker compose -f docker-compose.yml up` on its own — skipping
  # the override — is not a supported invocation (same as for production, see CLAUDE.md); nginx
  # would start here with no config mounted and fail.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

  frontend:
    build:
      context: ./frontend
      target: production

  api:
    build:
      context: ./backend
      target: production
    expose:
      - "3000"
    volumes:
      - app_storage:/app/uploads
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      - postgres

  postgres:
    # pgvector-enabled image (no official -alpine variant for pg18 yet, hence the base-image
    # switch from postgres:18-alpine) — backs profile_evidence/conversation_evidence's semantic
    # search. See backend/src/db/migrations/20260820000001_enable_pgvector.ts.
    image: pgvector/pgvector:pg18
    expose:
      - "5432"
    env_file:
      - .env
    # 18+ images changed the expected volume layout — PGDATA now defaults to a major-version-
    # named subdirectory (/var/lib/postgresql/18/docker) so pg_upgrade --link works across
    # versions within one mount, and the entrypoint refuses to start (or, worse, silently
    # initializes into the container's own writable layer instead of the volume — verified by
    # hand against this exact image) if the volume is mounted at the old .../data path instead
    # of this parent directory. See https://github.com/docker-library/postgres/pull/1259.
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
  app_storage:
