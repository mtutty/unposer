name: CI

# Quality gate for deployment: the `deploy` branch (which the production
# server polls via infra/update-unposer, see infra/README.md) only ever
# moves when a push to `main` passes every job below. Nothing pushes to
# `deploy` directly.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # ubuntu-latest ships Chrome already; karma.conf.js's ChromeHeadlessCI
      # launcher adds --no-sandbox for it.
      - run: npm run test:ci

  # `npm run build` above only proves the TypeScript/Angular build succeeds
  # on the CI runner directly — it says nothing about whether the actual
  # Dockerfiles (what the production server builds) still work. Building
  # both images here, without pushing anywhere (no registry — see
  # docker-compose.production.yml), catches Dockerfile-level breaks
  # (COPY of a path .dockerignore now excludes, a broken multi-stage
  # COPY --from, etc.) on push instead of during a production deploy.
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build ./backend
      - run: docker build --target production ./frontend

  # Fast-forwards `deploy` to this commit. Only runs for actual pushes to
  # main (not PRs), and only once every job above succeeds.
  promote:
    runs-on: ubuntu-latest
    needs: [backend, frontend, docker-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push origin HEAD:deploy
