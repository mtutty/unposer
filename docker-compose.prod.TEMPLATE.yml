services:
  api:
    image: ${DOCKERHUB_NAMESPACE:-gforgegroup}/gforge-crm-app:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile

  worker:
    image: ${DOCKERHUB_NAMESPACE:-gforgegroup}/gforge-crm-app:latest
    build:
      context: .
      dockerfile: packages/api/Dockerfile

  web:
    image: ${DOCKERHUB_NAMESPACE:-gforgegroup}/gforge-crm-web:latest
    build:
      context: .
      dockerfile: packages/web/Dockerfile
      target: production

  # Reverse proxy that terminates TLS using the Let's Encrypt cert and
  # forwards everything to the web container (which itself proxies /api/
  # to the api container).
  nginx-proxy:
    image: nginx:1.27-alpine
    depends_on:
      - web
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    volumes:
      - ./infra/nginx/prod.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "envsubst '$$DOMAIN_NAME' < /etc/nginx/templates/default.conf.template > /etc/nginx/conf.d/default.conf &&
       nginx -g 'daemon off;'"
    restart: unless-stopped

  # Periodically renews the Let's Encrypt certificate. Initial issuance is
  # handled by infra/init-letsencrypt.sh.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done"
    restart: unless-stopped

volumes:
  certbot-conf:
  certbot-www:
