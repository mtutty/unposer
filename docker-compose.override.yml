# Development overrides
# Automatically loaded by docker-compose
# Use this for local development with hot-reload
services:
  # The base docker-compose.yml's `nginx` service has no config of its own — this is the only
  # place nginx/nginx.dev.conf gets mounted in, and this file is what makes that service
  # actually runnable (see the comment on it in docker-compose.yml).
  nginx:
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/nginx.conf:ro

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: ["npm", "start", "--", "--host", "0.0.0.0", "--poll", "2000", "--proxy-config", "proxy.conf.json"]

  api:
    build:
      context: ./backend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules

  postgres:
    ports:
      - "5432:5432"
